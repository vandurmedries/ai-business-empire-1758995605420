name: Install AI Founder Empire source

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-* > /tmp/ai-founder-empire.tar.gz.b64
          base64 --decode /tmp/ai-founder-empire.tar.gz.b64 > /tmp/ai-founder-empire.tar.gz
          echo "b0b8ea6d020be6c7f526ef61ad85a8e3dd0d3a77b18e696e942aaf5e2b8323e4  /tmp/ai-founder-empire.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/ai-founder-empire.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify backend
        working-directory: backend
        run: |
          npm ci
          npm run verify

      - name: Install Luau 0.736
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/luau-lang/luau/releases/download/0.736/luau-ubuntu.zip \
            --output /tmp/luau.zip
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile

      - name: Compile every Luau source file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Compiling $file"
            /tmp/luau/luau-compile "$file" >/dev/null
          done < <(find src -type f -name '*.lua' -print0)

      - name: Install Rojo 7.7.0
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip \
            --output /tmp/rojo.zip
          unzip -q /tmp/rojo.zip -d /tmp/rojo
          chmod +x /tmp/rojo/rojo

      - name: Build Roblox place
        run: /tmp/rojo/rojo build default.project.json --output AI-Founder-Empire.rbxlx

      - name: Upload verified Roblox place
        uses: actions/upload-artifact@v4
        with:
          name: AI-Founder-Empire-place
          path: AI-Founder-Empire.rbxlx

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: add tested Roblox AI Founder Empire MVP"
          git push origin HEAD:main
